<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Code Sandbox</title>
</head>
<body style="background: transparent; margin: 0; padding: 0;">
  <script>
    let pyodide = null;
    let pyodideLoadingPromise = null;

    async function getPyodide() {
      if (pyodideLoadingPromise) return pyodideLoadingPromise;
      pyodideLoadingPromise = (async () => {
        const { loadPyodide } = await import('https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.mjs');
        pyodide = await loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.0/full/'
        });
        return pyodide;
      })();
      return pyodideLoadingPromise;
    }

    window.addEventListener('message', async (event) => {
      // Validate message action
      if (!event.data || event.data.action !== 'run') return;

      const { language, code } = event.data;
      const logs = [];
      
      // Capture standard console outputs
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;

      console.log = (...args) => {
        logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      console.error = (...args) => {
        logs.push('[ERROR] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      console.warn = (...args) => {
        logs.push('[WARN] ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };

      try {
        if (language === 'python') {
          const pyInstance = await getPyodide();
          const outputBuffer = [];
          
          pyInstance.setStdout({
            batched: (str) => {
              outputBuffer.push(str);
            }
          });
          pyInstance.setStderr({
            batched: (str) => {
              outputBuffer.push(str);
            }
          });
          
          await pyInstance.runPythonAsync(code);
          
          event.source.postMessage({
            action: 'result',
            output: outputBuffer.join('\n'),
            error: ''
          }, event.origin || '*');
        } else if (language === 'javascript') {
          const fn = new Function(code);
          fn();
          
          event.source.postMessage({
            action: 'result',
            output: logs.join('\n'),
            error: ''
          }, event.origin || '*');
        } else {
          event.source.postMessage({
            action: 'result',
            output: '',
            error: 'Unsupported sandbox language: ' + language
          }, event.origin || '*');
        }
      } catch (err) {
        event.source.postMessage({
          action: 'result',
          output: logs.join('\n'),
          error: err.message || String(err)
        }, event.origin || '*');
      } finally {
        console.log = originalLog;
        console.error = originalError;
        console.warn = originalWarn;
      }
    });

    // Notify parent that sandbox is initialized
    window.parent.postMessage({ action: 'sandbox-ready' }, '*');
  </script>
</body>
</html>
